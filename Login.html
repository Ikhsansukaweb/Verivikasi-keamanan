<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN ADMIN - DZKALL</title>
    <style>
        body { 
            background: #2c3e50; font-family: sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; color: white;
        }
        .login-box { 
            background: #34495e; padding: 30px; border-radius: 12px; 
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input { 
            width: 100%; padding: 12px; margin: 15px 0; border: none; 
            border-radius: 5px; box-sizing: border-box; text-align: center;
        }
        button { 
            background: #e67e22; color: white; border: none; 
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔑 Admin Access</h2>
    <p>Masukkan Password Rahasia</p>
    <input type="password" id="pass" placeholder="Password Disini...">
    <br>
    <button onclick="cekPassword()">MASUK</button>
</div>

<script>
    function cekPassword() {
        const p = document.getElementById("pass").value;
        // GANTI PASSWORD DI BAWAH INI SESUKA KAMU
        if (p === "ikhsanganteng") { 
            // Nama file admin kamu (pastikan sesuai)
            window.location.href = "admin-dzkall-rahasia.html"; 
        } else {
            alert("Password Salah, San! Coba lagi.");
        }
    }
</script>

</body>
</html>
