<!DOCTYPE html>
<html>
<head>
    <title>SannShop - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #27ae60; }
        .brand { color: #ff9800; font-size: 24px; font-weight: bold; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>
    <div class="box">
        <span class="brand">SANN SHOP</span>
        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">LOGIN / DAFTAR</button>
        <p style="font-size: 11px; color: #666; margin-top: 15px;">Admin: admin | Pass: admin123</p>
    </div>

    <script>
        const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

        async function login() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(!u || !p) return alert("Isi data!");

            if(u === "admin" && p === "admin123") {
                localStorage.setItem("sann_user", "admin");
                window.location.href = "admin.html";
                return;
            }

            // Cek apakah user ada, jika tidak otomatis daftar
            const res = await fetch(`${S_URL}/users_web?username=eq.${u}`, { headers: { "apikey": S_KEY } });
            const data = await res.json();

            if(data.length === 0) {
                await fetch(`${S_URL}/users_web`, {
                    method: 'POST', headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });
                alert("Akun baru dibuat!");
            } else if(data[0].password !== p) {
                return alert("Password salah!");
            }

            localStorage.setItem("sann_user", u);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
