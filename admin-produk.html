<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - DZKALL SHOP Blue</title>
    <style>
        :root { --blue-dark: #2c3e50; --blue-light: #3498db; --bg: #f0f3f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .header { background: var(--blue-dark); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .form-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .grid-input { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-save { background: var(--blue-light); color: white; }
        .btn-save:hover { background: #2980b9; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th { background: var(--blue-dark); color: white; padding: 15px; text-align: left; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        .img-table { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .btn-edit { background: #f1c40f; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0">⚙️ ADMIN PANEL BLUE</h2>
        <small>DZKALL SHOP - Fix API Connection</small>
    </div>

    <div class="form-box">
        <h4 id="form-title" style="margin-top:0; color: var(--blue-dark);">➕ Tambah/Edit Produk</h4>
        <input type="hidden" id="p_id">
        <div class="grid-input">
            <input type="text" id="p_nama" placeholder="Nama Produk">
            <input type="number" id="p_harga" placeholder="Harga (Angka)">
            <input type="number" id="p_stok" placeholder="Stok">
            <input type="text" id="p_img" placeholder="Link Gambar (URL)">
        </div>
        <button class="btn btn-save" id="btn-save" onclick="simpanProduk()">SIMPAN PERUBAHAN</button>
        <button class="btn" style="background:#95a5a6; color:white; display:none;" id="btn-cancel" onclick="resetForm()">BATAL</button>
    </div>

    <table id="tabel-produk">
        <thead>
            <tr>
                <th>Foto</th>
                <th>Produk</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="list-produk">
            <tr><td colspan="5" style="text-align:center;">Menghubungkan ke database...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // KEY TERBARU YANG SUDAH DIBERSIHKAN
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

    async function loadProduk() {
        try {
            const res = await fetch(`${S_URL}/rest/v1/produk?order=id.asc`, {
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
            });
            if (!res.ok) throw new Error("API Key Invalid");
            const data = await res.json();
            const list = document.getElementById("list-produk");
            list.innerHTML = data.map(p => `
                <tr>
                    <td><img src="${p.img_url}" class="img-table" onerror="this.src='https://via.placeholder.com/50'"></td>
                    <td><b>${p.nama_produk}</b></td>
                    <td>Rp ${p.harga.toLocaleString()}</td>
                    <td>${p.stok}</td>
                    <td>
                        <button class="btn-edit" onclick='isiForm(${JSON.stringify(p)})'>Edit</button>
                    </td>
                </tr>
            `).join("");
        } catch (e) {
            document.getElementById("list-produk").innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Gagal: ${e.message}. Cek S_KEY kamu!</td></tr>`;
        }
    }

    function isiForm(p) {
        document.getElementById("p_id").value = p.id;
        document.getElementById("p_nama").value = p.nama_produk;
        document.getElementById("p_harga").value = p.harga;
        document.getElementById("p_stok").value = p.stok;
        document.getElementById("p_img").value = p.img_url;
        document.getElementById("btn-save").innerText = "UPDATE PRODUK";
        document.getElementById("btn-cancel").style.display = "block";
    }

    function resetForm() {
        document.getElementById("p_id").value = "";
        document.getElementById("p_nama").value = "";
        document.getElementById("p_harga").value = "";
        document.getElementById("p_stok").value = "";
        document.getElementById("p_img").value = "";
        document.getElementById("btn-save").innerText = "SIMPAN PERUBAHAN";
        document.getElementById("btn-cancel").style.display = "none";
    }

    async function simpanProduk() {
        const id = document.getElementById("p_id").value;
        const payload = {
            nama_produk: document.getElementById("p_nama").value,
            harga: parseInt(document.getElementById("p_harga").value),
            stok: parseInt(document.getElementById("p_stok").value),
            img_url: document.getElementById("p_img").value
        };

        if(!payload.nama_produk || isNaN(payload.harga)) return alert("Data tidak lengkap!");

        const method = id ? "PATCH" : "POST";
        const url = id ? `${S_URL}/rest/v1/produk?id=eq.${id}` : `${S_URL}/rest/v1/produk`;

        const res = await fetch(url, {
            method: method,
            headers: { 
                "apikey": S_KEY, 
                "Authorization": `Bearer ${S_KEY}`, 
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify(payload)
        });

        if(res.ok) {
            alert("Berhasil!");
            resetForm();
            loadProduk();
        } else {
            const err = await res.json();
            alert("Gagal: " + err.message);
        }
    }

    loadProduk();
</script>
</body>
</html>
