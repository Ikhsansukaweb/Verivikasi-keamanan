<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - DZKALL SHOP</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f4f4f4; color: #333; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 900px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { color: #855e42; border-bottom: 2px solid #855e42; padding-bottom: 10px; }
        input { width: 100%; padding: 10px; margin: 5px 0 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #855e42; color: white; }
        .del-btn { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .restore-btn { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="box">
    <h3>⚙️ Kelola Produk</h3>
    <input type="hidden" id="p_id">
    <input type="text" id="p_nama" placeholder="Nama Produk">
    <input type="number" id="p_harga" placeholder="Harga">
    <input type="number" id="p_stok" placeholder="Stok">
    <input type="text" id="p_img" placeholder="URL Gambar">
    <button class="btn-save" onclick="simpanProduk()">SIMPAN PRODUK</button>

    <table id="tabel-produk">
        <thead><tr><th>Gambar</th><th>Nama</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<div class="box">
    <h3>📑 Pesanan Masuk (Antrean)</h3>
    <table id="tabel-pesanan">
        <thead><tr><th>IGN</th><th>Item</th><th>Qty</th><th>Status</th><th>Aksi</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

    async function loadSemua() {
        loadProduk();
        loadPesanan();
    }

    async function loadProduk() {
        const res = await fetch(`${S_URL}/rest/v1/produk?order=id.asc`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        document.querySelector("#tabel-produk tbody").innerHTML = data.map(p => `
            <tr>
                <td><img src="${p.img_url}" class="img-preview"></td>
                <td><b>${p.nama_produk}</b></td>
                <td>Rp ${p.harga}</td>
                <td>${p.stok}</td>
                <td><button class="del-btn" onclick="hapusProduk(${p.id})">Hapus</button></td>
            </tr>
        `).join("");
    }

    async function loadPesanan() {
        const res = await fetch(`${S_URL}/rest/v1/penjualan?status=eq.PENDING&order=created_at.desc`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        document.querySelector("#tabel-pesanan tbody").innerHTML = data.map(i => `
            <tr>
                <td>${i.ign}</td>
                <td>${i.nama_item}</td>
                <td>${i.jumlah}</td>
                <td><span style="color:orange">${i.status}</span></td>
                <td>
                    <button class="restore-btn" onclick="batalkanPesanan(${i.id}, '${i.nama_item}', ${i.jumlah})">Batalkan & Balikin Stok</button>
                </td>
            </tr>
        `).join("");
    }

    async function batalkanPesanan(idJual, namaItem, qty) {
        if(!confirm(`Batalkan pesanan ${namaItem}? Stok akan otomatis bertambah +${qty}`)) return;

        try {
            // 1. Ambil stok sekarang
            const resProd = await fetch(`${S_URL}/rest/v1/produk?nama_produk=eq.${namaItem}`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
            const dataProd = await resProd.json();
            
            if(dataProd.length > 0) {
                const stokBaru = dataProd[0].stok + qty;
                // 2. Update stok produk (Kembalikan)
                await fetch(`${S_URL}/rest/v1/produk?id=eq.${dataProd[0].id}`, {
                    method: "PATCH",
                    headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ stok: stokBaru })
                });
            }

            // 3. Ubah status pesanan jadi BATAL (biar hilang dari antrean)
            await fetch(`${S_URL}/rest/v1/penjualan?id=eq.${idJual}`, {
                method: "PATCH",
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ status: "BATAL" })
            });

            alert("Pesanan dibatalkan & Stok dikembalikan!");
            loadSemua();
        } catch(e) { alert("Error saat membatalkan!"); }
    }

    async function simpanProduk() {
        const obj = {
            nama_produk: document.getElementById("p_nama").value,
            harga: parseInt(document.getElementById("p_harga").value),
            stok: parseInt(document.getElementById("p_stok").value),
            img_url: document.getElementById("p_img").value
        };
        await fetch(`${S_URL}/rest/v1/produk`, {
            method: "POST",
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify(obj)
        });
        location.reload();
    }

    async function hapusProduk(id) {
        if(!confirm("Hapus produk?")) return;
        await fetch(`${S_URL}/rest/v1/produk?id=eq.${id}`, { method: "DELETE", headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        loadProduk();
    }

    loadSemua();
</script>
</body>
</html>
