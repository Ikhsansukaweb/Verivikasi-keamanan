<!DOCTYPE html>
<html>
<head>
  <title>Admin SannShop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
    .login-container { max-width: 300px; margin: 100px auto; text-align: center; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    .admin-content { display: none; } /* Tersembunyi sebelum login */
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: none; }
    button { width: 100%; padding: 100%; padding: 10px; background: #ff9800; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
    th, td { border: 1px solid #333; padding: 10px; text-align: left; }
    th { background: #333; }
    .omset-box { margin-top: 30px; padding: 20px; background: #2e7d32; border-radius: 10px; }
    h2 { color: #ff9800; }
  </style>
</head>
<body>

  <div id="loginBox" class="login-container">
    <h2>Admin Login</h2>
    <input type="password" id="passInput" placeholder="Masukkan Password">
    <button onclick="cekLogin()">Masuk</button>
  </div>

  <div id="adminContent" class="admin-content">
    <h1>🚀 Panel Admin SannShop</h1>
    
    <h3>Daftar Produk & Stok</h3>
    <div id="tabelProduk">Loading data...</div>

    <hr>

    <div class="omset-box">
      <h2>💰 Total Omset Penjualan</h2>
      <div id="displayOmset">Menghitung pemasukan...</div>
      <table id="tabelRiwayat">
        <thead>
          <tr>
            <th>Hari/Tanggal</th>
            <th>Item</th>
            <th>Qty</th>
            <th>Total Bayar</th>
          </tr>
        </thead>
        <tbody id="listOmset"></tbody>
      </table>
    </div>
  </div>

  <script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    const PASS_BENAR = "admin123"; // GANTI PASSWORD KAMU DI SINI

    function cekLogin() {
      const input = document.getElementById('passInput').value;
      if(input === PASS_BENAR) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        muatData();
      } else {
        alert("Password Salah San!");
      }
    }

    async function muatData() {
      // 1. Ambil Data Produk
      const resProd = await fetch(`${S_URL}/produk`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
      const produk = await resProd.json();
      
      let htmlProd = "<table><tr><th>Item</th><th>Stok</th><th>Harga</th></tr>";
      produk.forEach(p => {
        htmlProd += `<tr><td>${p.nama_produk}</td><td>${p.stok}</td><td>Rp ${p.harga}</td></tr>`;
      });
      document.getElementById('tabelProduk').innerHTML = htmlProd + "</table>";

      // 2. Ambil Data Penjualan (Hanya yang SUCCESS)
      const resJual = await fetch(`${S_URL}/penjualan?status=eq.SUCCESS&select=*`, { 
        headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } 
      });
      const penjualan = await resJual.json();

      let totalPemasukan = 0;
      let htmlJual = "";
      
      penjualan.forEach(j => {
        totalPemasukan += parseInt(j.total_bayar || 0);
        // Format tanggal biar enak dibaca
        let tgl = new Date(j.created_at).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        htmlJual += `<tr>
          <td>${tgl}</td>
          <td>${j.nama_item}</td>
          <td>${j.qty}</td>
          <td>Rp ${Number(j.total_bayar).toLocaleString()}</td>
        </tr>`;
      });

      document.getElementById('displayOmset').innerHTML = `<h3>Total Pemasukan Bersih: Rp ${totalPemasukan.toLocaleString()}</h3>`;
      document.getElementById('listOmset').innerHTML = htmlJual;
    }
  </script>
</body>
</html>
