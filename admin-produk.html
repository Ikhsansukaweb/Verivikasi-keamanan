<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kelola Produk DZKALL</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .admin-card { background: white; max-width: 800px; margin: auto; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #34495e; color: white; padding: 20px; text-align: center; }
        .form-section { padding: 20px; border-bottom: 2px solid #eee; }
        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .btn-save { background: #3498db; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .table-section { padding: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #34495e; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .prod-img { width: 40px; height: 40px; object-fit: cover; border-radius: 5px; }
        .btn-edit { background: #f1c40f; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .badge-stok { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .stok-aman { background: #dff9fb; color: #2ecc71; }
        .stok-habis { background: #fab1a0; color: #d63031; }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="header">
        <h2 style="margin:0">⚙️ KELOLA PRODUK DZKALL</h2>
        <small>Supabase & Telegram Integration Fix</small>
    </div>

    <div class="form-section">
        <h4 style="margin-top:0">➕ Tambah / Edit Produk</h4>
        <input type="hidden" id="p-id">
        <div class="grid-form">
            <input type="text" id="p-nama" placeholder="Nama Produk">
            <input type="number" id="p-harga" placeholder="Harga (Contoh: 2000)">
            <input type="number" id="p-stok" placeholder="Jumlah Stok">
            <input type="text" id="p-img" placeholder="Link Gambar (URL)">
        </div>
        <button class="btn-save" onclick="simpanProduk()">SIMPAN PERUBAHAN</button>
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="list-produk">
                </tbody>
        </table>
    </div>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

    async function loadProduk() {
        const res = await fetch(`${S_URL}/rest/v1/produk?order=id.asc`, {
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
        });
        const data = await res.json();
        const container = document.getElementById("list-produk");
        container.innerHTML = data.map(p => `
            <tr>
                <td><img src="${p.img_url}" class="prod-img" onerror="this.src='https://via.placeholder.com/50'"></td>
                <td><b>${p.nama_produk}</b></td>
                <td>Rp ${p.harga.toLocaleString()}</td>
                <td><span class="badge-stok ${p.stok > 0 ? 'stok-aman' : 'stok-habis'}">${p.stok}</span></td>
                <td>
                    <button class="btn-edit" onclick="isiForm(${JSON.stringify(p).replace(/"/g, '&quot;')})">Edit</button>
                    <button class="btn-delete" onclick="hapusProduk(${p.id}, '${p.nama_produk}')">Hapus</button>
                </td>
            </tr>
        `).join("");
    }

    function isiForm(p) {
        document.getElementById("p-id").value = p.id;
        document.getElementById("p-nama").value = p.nama_produk;
        document.getElementById("p-harga").value = p.harga;
        document.getElementById("p-stok").value = p.stok;
        document.getElementById("p-img").value = p.img_url;
        window.scrollTo(0,0);
    }

    async function simpanProduk() {
        const id = document.getElementById("p-id").value;
        const body = {
            nama_produk: document.getElementById("p-nama").value,
            harga: parseInt(document.getElementById("p-harga").value),
            stok: parseInt(document.getElementById("p-stok").value),
            img_url: document.getElementById("p-img").value
        };

        const method = id ? "PATCH" : "POST";
        const url = id ? `${S_URL}/rest/v1/produk?id=eq.${id}` : `${S_URL}/rest/v1/produk`;

        await fetch(url, {
            method: method,
            headers: { 
                "apikey": S_KEY, 
                "Authorization": `Bearer ${S_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },
            body: JSON.stringify(body)
        });

        alert("Berhasil disimpan!");
        location.reload();
    }

    // --- FITUR HAPUS PRODUK ---
    async function hapusProduk(id, nama) {
        if (confirm(`Yakin ingin menghapus produk "${nama}"? Tindakan ini tidak bisa dibatalkan.`)) {
            try {
                const res = await fetch(`${S_URL}/rest/v1/produk?id=eq.${id}`, {
                    method: "DELETE",
                    headers: { 
                        "apikey": S_KEY, 
                        "Authorization": `Bearer ${S_KEY}`
                    }
                });
                
                if (res.ok) {
                    alert("Produk berhasil dihapus!");
                    loadProduk(); // Refresh list tanpa reload halaman penuh
                } else {
                    alert("Gagal menghapus produk.");
                }
            } catch (err) {
                alert("Error: " + err.message);
            }
        }
    }

    loadProduk();
</script>
</body>
</html>
