<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin SannShop - Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 15px; margin: 0; padding-bottom: 100px; }
    .login-container { max-width: 350px; margin: 100px auto; text-align: center; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .admin-content { display: none; max-width: 900px; margin: auto; }
    
    input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; outline: none; }
    input:focus { border-color: #ff9800; }
    button { padding: 12px; background: #ff9800; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.3s; }
    button:hover { background: #e68a00; }
    
    .btn-full { width: 100%; }
    .btn-delete { background: #f44336; font-size: 12px; }
    .btn-edit { background: #2196f3; font-size: 12px; margin-right: 5px; }
    .btn-reset { background: #d32f2f; margin-left: 10px; padding: 5px 15px; }

    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
    th, td { border: 1px solid #333; padding: 12px; text-align: left; }
    th { background: #252525; color: #ff9800; }
    
    .omset-box { background: #1b5e20; border-left: 5px solid #4caf50; }
    .img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
    .flex-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
    h2 { margin: 0; color: #ff9800; }

    /* TOMBOL CS MELAYANG (Kiri Bawah) */
    .btn-cs-nav {
        position: fixed;
        bottom: 25px;
        left: 25px;
        width: 65px;
        height: 65px;
        background: #ffffff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        z-index: 10000;
        transition: 0.3s;
        border: 3px solid #ff9800;
        text-decoration: none;
    }
    .btn-cs-nav:hover { transform: scale(1.1); rotate: 5deg; }
    .btn-cs-nav img { width: 45px; height: 45px; border-radius: 50%; }
  </style>
</head>
<body>

  <a href="admin.html" class="btn-cs-nav" title="Buka Chat Admin">
      <img src="https://cdn-icons-png.flaticon.com/512/4233/4233830.png" alt="CS Admin">
  </a>

  <div id="loginBox" class="login-container">
    <h2>🔒 Admin SannShop</h2>
    <input type="password" id="passInput" placeholder="Masukkan Password Admin">
    <button onclick="cekLogin()" class="btn-full">UNLOCK PANEL</button>
  </div>

  <div id="adminContent" class="admin-content">
    <div class="flex-header">
        <h1>🚀 SannShop Control Panel</h1>
        <button onclick="logout()" style="background:#555; padding: 5px 15px;">Logout</button>
    </div>

    <div class="card">
      <h2>➕ Tambah Produk Baru</h2>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" id="newNama" placeholder="Nama Produk">
        <input type="number" id="newHarga" placeholder="Harga">
        <input type="number" id="newStok" placeholder="Jumlah Stok">
        <input type="text" id="newImg" placeholder="URL Gambar">
      </div>
      <button onclick="tambahProduk()" class="btn-full" style="margin-top: 10px; background: #4caf50;">SIMPAN PRODUK</button>
    </div>

    <div class="card">
      <h2>📦 Stok Barang</h2>
      <div id="tabelProduk" style="overflow-x: auto;">Memuat data produk...</div>
    </div>

    <div class="card omset-box">
      <div class="flex-header">
        <h2>💰 Laporan Omset</h2>
        <button onclick="hapusRiwayat()" class="btn-reset">Hapus Semua Riwayat</button>
      </div>
      <div id="displayTotal" style="font-size: 24px; font-weight: bold; margin-bottom: 15px;">Rp 0</div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Hari, Tanggal</th>
              <th>Item</th>
              <th>Qty</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="listOmset"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    const PASS_BENAR = "admin123";

    // Cek session login sederhana
    if(localStorage.getItem("admin_logged") === "true") {
        tampilkanPanel();
    }

    function cekLogin() {
      if(document.getElementById('passInput').value === PASS_BENAR) {
        localStorage.setItem("admin_logged", "true");
        tampilkanPanel();
      } else { alert("Password Salah!"); }
    }

    function tampilkanPanel() {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
        muatSemuaData();
    }

    function logout() {
        localStorage.removeItem("admin_logged");
        location.reload();
    }

    async function muatSemuaData() {
      muatProduk();
      muatOmset();
    }

    // --- MANAJEMEN PRODUK ---
    async function muatProduk() {
      try {
        const res = await fetch(`${S_URL}/produk?select=*&order=id.asc`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        let html = "<table><tr><th>Foto</th><th>Nama</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr>";
        data.forEach(p => {
          html += `<tr>
            <td><img src="${p.img_url}" class="img-preview" onerror="this.src='https://via.placeholder.com/40'"></td>
            <td>${p.nama_produk}</td>
            <td>Rp ${Number(p.harga).toLocaleString()}</td>
            <td><b>${p.stok}</b></td>
            <td>
              <button class="btn-edit" onclick="editProduk(${p.id}, ${p.stok}, ${p.harga})">Edit</button>
              <button class="btn-delete" onclick="hapusProduk(${p.id})">Hapus</button>
            </td>
          </tr>`;
        });
        document.getElementById('tabelProduk').innerHTML = html + "</table>";
      } catch (e) { document.getElementById('tabelProduk').innerText = "Gagal memuat data."; }
    }

    async function tambahProduk() {
      const nama = document.getElementById('newNama').value;
      const harga = document.getElementById('newHarga').value;
      const stok = document.getElementById('newStok').value;
      const img = document.getElementById('newImg').value;

      if(!nama || !harga) return alert("Nama dan Harga wajib diisi!");

      const payload = {
        nama_produk: nama,
        harga: parseInt(harga),
        stok: parseInt(stok || 0),
        img_url: img || ""
      };

      await fetch(`${S_URL}/produk`, {
        method: 'POST',
        headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      
      // Reset input
      document.getElementById('newNama').value = "";
      document.getElementById('newHarga').value = "";
      document.getElementById('newStok').value = "";
      document.getElementById('newImg').value = "";
      
      muatProduk();
    }

    async function editProduk(id, stokLama, hargaLama) {
      const stokBaru = prompt("Stok Baru:", stokLama);
      const hargaBaru = prompt("Harga Baru:", hargaLama);
      if (stokBaru !== null && hargaBaru !== null) {
        await fetch(`${S_URL}/produk?id=eq.${id}`, {
          method: 'PATCH',
          headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
          body: JSON.stringify({ stok: parseInt(stokBaru), harga: parseInt(hargaBaru) })
        });
        muatProduk();
      }
    }

    async function hapusProduk(id) {
      if(confirm("Yakin ingin menghapus produk ini?")) {
        await fetch(`${S_URL}/produk?id=eq.${id}`, {
          method: 'DELETE',
          headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
        });
        muatProduk();
      }
    }

    // --- MANAJEMEN OMSET ---
    async function muatOmset() {
      try {
        const res = await fetch(`${S_URL}/penjualan?status=eq.SUCCESS&select=*`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        let total = 0;
        let html = "";
        data.forEach(j => {
          total += Number(j.total_bayar);
          let tgl = new Date(j.created_at).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' });
          html += `<tr><td>${tgl}</td><td>${j.nama_item}</td><td>${j.jumlah || 1}</td><td>Rp ${Number(j.total_bayar).toLocaleString()}</td></tr>`;
        });
        document.getElementById('displayTotal').innerText = "Total Omset: Rp " + total.toLocaleString();
        document.getElementById('listOmset').innerHTML = html || "<tr><td colspan='4' style='text-align:center;'>Belum ada data penjualan sukses.</td></tr>";
      } catch (e) { console.error("Gagal muat omset"); }
    }

    async function hapusRiwayat() {
      if(confirm("Hapus semua riwayat transaksi (SUCCESS & CANCELLED)? Tindakan ini permanen!")) {
        await fetch(`${S_URL}/penjualan?status=in.("SUCCESS","CANCELLED")`, { 
            method: 'DELETE', 
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } 
        });
        alert("Riwayat dibersihkan!");
        muatOmset();
      }
    }
  </script>
</body>
  </html>
