<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SannShop - DonutSmp Official</title>
    <style>
        :root { --primary: #2ecc71; --bg: #121212; --card: #1e1e1e; --text: #ffffff; --accent: #ff9800; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        /* 1. LAYAR LOGIN */
        #loginPage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .login-box { background: var(--card); padding: 30px; border-radius: 15px; width: 300px; text-align: center; border: 1px solid #333; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* 2. TAMPILAN TOKO */
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .header { text-align: center; padding: 40px 0; background: url('https://i.ibb.co/6R7m9Zz/minecraft-bg.jpg'); background-size: cover; border-radius: 0 0 20px 20px; }
        .grid-produk { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #333; }
        .card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .btn-beli { width: 100%; padding: 10px; background: var(--primary); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }

        /* 3. MODAL QRIS */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { background: white; color: #333; margin: 5% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 15px; }

        /* 4. TOMBOL CHAT */
        .btn-chat { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2 style="color:var(--accent)">SANN SHOP</h2>
        <p style="font-size:12px; color:#888;">Masuk untuk mulai belanja</p>
        <input type="text" id="uInp" placeholder="Username">
        <input type="password" id="pInp" placeholder="Password">
        <button onclick="prosesLogin()" class="btn-login">MASUK / DAFTAR</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <h1 style="margin:0; letter-spacing: 2px;">SANNSHOP</h1>
        <p>⚡ DonutSmp Shop Aman Terpercaya ⚡</p>
    </div>

    <div class="grid-produk" id="listProduk">Memuat item...</div>
</div>

<a href="chat.html" class="btn-chat" id="chatBtn" style="display:none;">💬 Chat Admin</a>

<div id="modalBeli" class="modal">
    <div class="modal-content">
        <h3 id="mJudul" style="margin:0">Pembelian Item</h3>
        <p id="mHarga" style="color:var(--accent); font-weight:bold;"></p>
        
        <div style="text-align:center; background:#f9f9f9; padding:10px; border-radius:10px;">
            <p style="font-size:11px;">Scan QRIS Dana/Gopay:</p>
            <img src="https://via.placeholder.com/200?text=QRIS+KAMU" id="qrisImg" style="width:200px; border-radius:10px;">
        </div>

        <input type="text" id="fIGN" placeholder="Nickname Minecraft" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd; border-radius:5px;">
        <input type="number" id="fWA" placeholder="Nomor WhatsApp" style="width:100%; padding:10px; margin-top:10px; border:1px solid #ddd; border-radius:5px;">
        
        <p style="font-size:11px; margin:10px 0 5px 0;">Upload Bukti TF:</p>
        <input type="file" id="fBukti" accept="image/*">

        <button onclick="kirimPesanan()" id="btnKirim" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; margin-top:15px; font-weight:bold;">KIRIM KE TELEGRAM</button>
        <button onclick="document.getElementById('modalBeli').style.display='none'" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Batal</button>
    </div>
</div>

<script>
const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxcOkW3Sawjvq6txaA6BlKGA8VSPvJbESE9Zml0_5iLGAbrZM5Raj0nzIC-gL5KdBGiog/exec";

let user = localStorage.getItem("sann_user");
let pSel = null;

// LOGIKA LOGIN
if(user) { 
    document.getElementById('loginPage').style.display='none'; 
    document.getElementById('chatBtn').style.display='block';
}

async function prosesLogin() {
    const u = document.getElementById('uInp').value;
    const p = document.getElementById('pInp').value;
    if(!u || !p) return alert("Isi data!");

    if(u === 'admin' && p === 'admin123') {
        localStorage.setItem("sann_user", "admin");
        window.location.href = "admin.html";
        return;
    }

    const res = await fetch(`${S_URL}/users_web?username=eq.${u}`, { headers: {"apikey": S_KEY} });
    const data = await res.json();

    if(data.length === 0) {
        await fetch(`${S_URL}/users_web`, {
            method:'POST', headers:{"apikey":S_KEY,"Content-Type":"application/json"},
            body: JSON.stringify({username:u, password:p})
        });
    } else if(data[0].password !== p) { return alert("Salah password!"); }

    localStorage.setItem("sann_user", u);
    location.reload();
}

// LOGIKA TOKO
async function muatProduk() {
    const res = await fetch(`${S_URL}/produk?select=*`, { headers:{"apikey":S_KEY} });
    const data = await res.json();
    let h = "";
    data.forEach(p => {
        h += `<div class="card">
            <img src="${p.img_url}">
            <h4>${p.nama_produk}</h4>
            <p style="color:var(--primary); font-weight:bold;">Rp ${Number(p.harga).toLocaleString()}</p>
            <button onclick='bukaModal(${JSON.stringify(p)})' class="btn-beli">BELI</button>
        </div>`;
    });
    document.getElementById('listProduk').innerHTML = h;
}

function bukaModal(p) {
    pSel = p;
    document.getElementById('modalBeli').style.display='block';
    document.getElementById('mJudul').innerText = p.nama_produk;
    document.getElementById('mHarga').innerText = "Harga: Rp " + p.harga.toLocaleString();
}

async function kirimPesanan() {
    const ign = document.getElementById('fIGN').value;
    const wa = document.getElementById('fWA').value;
    const file = document.getElementById('fBukti').files[0];
    if(!ign || !wa || !file) return alert("Lengkapi data!");

    document.getElementById('btnKirim').innerText = "Mengirim...";
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = async function() {
        const img64 = reader.result.split(',')[1];
        
        // Simpan DB
        const res = await fetch(`${S_URL}/penjualan`, {
            method:'POST', headers:{"apikey":S_KEY,"Authorization":`Bearer ${S_KEY}`,"Content-Type":"application/json","Prefer":"return=representation"},
            body: JSON.stringify({ign:ign, wa_pembeli:wa, nama_item:pSel.nama_produk, total_bayar:pSel.harga, status:"PENDING", username_web: user})
        });
        const hasil = await res.json();

        // Kirim Telegram
        await fetch(GAS_URL, {
            method:'POST', body: JSON.stringify({action:"upload_bukti", id_jual:hasil[0].id, ign:ign, wa_pembeli:wa, nama_item:pSel.nama_produk, total_bayar:hasil[0].total_bayar, username_web:user, image:img64})
        });

        alert("Pesanan terkirim ke Telegram Admin!");
        location.reload();
    }
}
muatProduk();
</script>
</body>
</html>
