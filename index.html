<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SannShop - Private Chat System</title>
    <style>
        :root { --primary: #2ecc71; --bg: #121212; --card: #1e1e1e; --text: #ffffff; --accent: #ff9800; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        .box { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        
        /* Chat Private Style */
        .chat-container { background: var(--card); border-radius: 15px; border: 1px solid #333; height: 400px; display: flex; flex-direction: column; }
        #chatDisplay { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Bubble Chat */
        .bubble { padding: 10px 14px; border-radius: 15px; max-width: 75%; font-size: 14px; position: relative; }
        .me { background: var(--primary); align-self: flex-end; color: white; border-bottom-right-radius: 2px; }
        .admin { background: #333; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid var(--accent); }
        .time { font-size: 9px; opacity: 0.7; display: block; margin-top: 5px; text-align: right; }

        input, .btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .btn-green { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--accent);">SANN PRIVATE CHAT</h2>

    <div id="authSection" class="box">
        <input type="text" id="userInp" placeholder="Username">
        <input type="password" id="passInp" placeholder="Password">
        <button onclick="handleAuth('login')" class="btn-green btn" style="margin-top:10px;">Login / Masuk Chat</button>
        <p style="font-size:11px; text-align:center;">Belum punya akun? <a href="#" onclick="handleAuth('daftar')" style="color:var(--accent)">Daftar Disini</a></p>
    </div>

    <div id="chatSection" class="hidden">
        <div class="box" style="display:flex; justify-content: space-between; align-items: center; padding:10px;">
            <span>Chatting as: <b id="namaUser" style="color:var(--accent)"></b></span>
            <button onclick="logout()" style="background:red; color:white; border:none; padding:5px; border-radius:5px; font-size:10px;">Logout</button>
        </div>

        <div class="chat-container">
            <div id="chatDisplay">Memuat pesan private...</div>
            <div style="display:flex; padding:10px; gap:5px; border-top:1px solid #333;">
                <input type="text" id="msgInp" placeholder="Hubungi Admin..." style="margin:0;">
                <button onclick="kirimPesan()" class="btn-green" style="width:70px; border:none; cursor:pointer;">Kirim</button>
            </div>
        </div>
        <p style="font-size:10px; color:#888; text-align:center; margin-top:10px;">⚠️ Pesan ini hanya bisa dilihat oleh kamu dan Admin.</p>
    </div>
</div>

<script>
const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";

let userAktif = localStorage.getItem("sann_user");

if(userAktif) {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('chatSection').classList.remove('hidden');
    document.getElementById('namaUser').innerText = userAktif;
    muatChatPrivate();
    setInterval(muatChatPrivate, 3000);
}

async function handleAuth(mode) {
    const user = document.getElementById('userInp').value;
    const pass = document.getElementById('passInp').value;
    if(!user || !pass) return alert("Isi data!");

    if(mode === 'daftar') {
        await fetch(`${S_URL}/users_web`, {
            method: 'POST', headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ username: user, password: pass })
        });
        alert("Berhasil daftar! Silakan Login.");
    } else {
        const res = await fetch(`${S_URL}/users_web?username=eq.${user}&password=eq.${pass}`, {
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
        });
        const data = await res.json();
        if(data.length > 0) {
            localStorage.setItem("sann_user", user);
            location.reload();
        } else alert("Gagal Login!");
    }
}

async function muatChatPrivate() {
    // Ambil pesan dimana pengirim = user ATAU penerima = user
    const res = await fetch(`${S_URL}/pesan_chat?or=(pengirim.eq.${userAktif},penerima.eq.${userAktif})&order=created_at.desc&limit=20`, {
        headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
    });
    const data = await res.json();
    let html = "";
    data.reverse().forEach(m => {
        const isMe = m.pengirim === userAktif;
        const tipe = isMe ? "me" : "admin";
        html += `<div class="bubble ${tipe}">
            ${m.isi_pesan}
            <span class="time">${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        </div>`;
    });
    document.getElementById('chatDisplay').innerHTML = html;
    const cd = document.getElementById('chatDisplay');
    cd.scrollTop = cd.scrollHeight;
}

async function kirimPesan() {
    const msg = document.getElementById('msgInp').value;
    if(!msg) return;

    await fetch(`${S_URL}/pesan_chat`, {
        method: 'POST', headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
        body: JSON.stringify({ pengirim: userAktif, penerima: 'admin', isi_pesan: msg })
    });
    document.getElementById('msgInp').value = "";
    muatChatPrivate();
}

function logout() { localStorage.removeItem("sann_user"); location.reload(); }
</script>
</body>
</html>
