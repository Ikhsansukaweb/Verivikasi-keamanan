<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZKALL SHOP - Jual Money</title>
    <style>
        :root { --primary: #0088cc; --secondary: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .store-container { max-width: 450px; margin: auto; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .product-card { border: 2px solid #eef2f7; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; }
        .stock-badge { display: inline-block; background: var(--secondary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-top: 8px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        .qris-section { text-align: center; margin-top: 15px; display: none; padding: 10px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
        .qris-section img { 
            width: 250px; 
            height: auto; 
            border: 1px solid #ccc; 
            margin-top: 10px;
            image-rendering: -webkit-optimize-contrast; /* Biar QRIS lebih tajam */
        }

        .payment-box { background: #fff9e6; border-left: 5px solid #f1c40f; padding: 12px; margin-top: 15px; border-radius: 4px; }
        .btn-beli { background: var(--secondary); color: white; border: none; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .btn-beli:disabled { background: #ccc; }
        .footer { text-align: center; padding: 15px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="store-container">
    <div class="header">
        <h1>DZKALL SHOP</h1>
        <p>Top Up Aman & Terpercaya</p>
    </div>

    <div class="content">
        <div class="product-card">
            <span style="font-weight:bold; font-size: 1.3em;">1M MONEY</span><br>
            <div class="stock-badge">STOK: <span id="stok-angka">Mengecek...</span></div>
        </div>

        <label>Beli Berapa (M)?</label>
        <input type="number" id="jumlah" value="1" min="1" oninput="updateTotal()">

        <label>In Game Name (IGN)</label>
        <input type="text" id="ign" placeholder="Nickname Game">

        <label>Metode Pembayaran</label>
        <select id="metode" onchange="toggleQris()">
            <option value="DANA">DANA (08989294545)</option>
            <option value="GOPAY">GOPAY (08989294545)</option>
            <option value="QRIS">QRIS (Scan Gambar)</option>
        </select>

        <div id="qris-area" class="qris-section">
            <p style="font-size: 12px; margin:0; color: #d35400; font-weight: bold;">⚠️ SCAN & BAYAR SESUAI TOTAL ⚠️</p>
            <img id="gambar-qris" src="https://imgur.com/a/uq645Z7" alt="QRIS DZKALL">
        </div>

        <label>Upload Bukti Transfer</label>
        <input type="file" id="bukti" accept="image/*">
        
        <div class="payment-box">
            Total Bayar: <strong style="color: #e67e22; font-size: 1.2em;" id="total">Rp 600</strong>
        </div>

        <button class="btn-beli" id="submit-btn" onclick="kirimPesanan()">KONFIRMASI PEMBAYARAN</button>
    </div>
    <div class="footer">© 2026 DZKALL SHOP</div>
</div>

<script>
    // Link Exec Terbaru Ikhsan
    const webAppUrl = "https://script.google.com/macros/s/AKfycbw2ztI1pJJV2yYthStKYjI3VmEQAfRNUAWqHsmDV1E87XeOz7BAllNoV1UcrCZ7jWWN/exec";
    const hargaM = 600;
    let stokSekarang = 0;

    async function loadStok() {
        try {
            const res = await fetch(webAppUrl);
            const data = await res.json();
            stokSekarang = parseInt(data.stok) || 0;
            document.getElementById("stok-angka").innerText = stokSekarang;
        } catch (e) { document.getElementById("stok-angka").innerText = "Gagal Muat"; }
    }

    function updateTotal() {
        const j = document.getElementById("jumlah").value;
        document.getElementById("total").innerText = "Rp " + (j * hargaM).toLocaleString();
    }

    function toggleQris() {
        const m = document.getElementById("metode").value;
        document.getElementById("qris-area").style.display = (m === "QRIS") ? "block" : "none";
    }

    function kirimPesanan() {
        const btn = document.getElementById("submit-btn");
        const ign = document.getElementById("ign").value;
        const file = document.getElementById("bukti").files[0];
        const jml = document.getElementById("jumlah").value;

        if (!ign || !file) return alert("Harap isi IGN dan upload Bukti!");
        if (stokSekarang > 0 && parseInt(jml) > stokSekarang) return alert("Stok tidak cukup!");

        btn.innerText = "Mengirim...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result.split(",")[1];
            const caption = `🚀 PESANAN BARU - DZKALL SHOP\n` +
                          `👤 IGN: ${ign}\n🔢 Jumlah: ${jml} M\n` +
                          `💳 Via: ${document.getElementById("metode").value}\n` +
                          `💰 Total: Rp ${(jml * hargaM).toLocaleString()}`;

            fetch(webAppUrl, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "upload_bukti", 
                    image: base64, 
                    type: file.type, 
                    caption: caption,
                    jumlah_beli: jml // Mengirim data jumlah beli agar stok berkurang
                })
            }).then(() => {
                alert("Berhasil! Stok akan otomatis berkurang.");
                location.reload();
            }).catch(() => {
                alert("Berhasil Terkirim ke Telegram Ikhsan!");
                location.reload();
            });
        };
        reader.readAsDataURL(file);
    }
    loadStok();
</script>
</body>
</html>
