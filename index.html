<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SannShop - Money Donut Aman Terpercaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --success: #27ae60; --bg: #f8f9fa; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #ececec url('https://i.ibb.co.com/SX9rTn7L/1773672279828.png') fixed center/cover; color: #333; }
        
        /* Header */
        .header { background: rgba(44, 62, 80, 0.95); color: white; padding: 25px 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .header h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.8; }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }

        /* Antrean Section */
        .antrean-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 25px; border-left: 6px solid var(--accent); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .antrean-header { font-weight: bold; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .antrean-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 14px; }
        .status-badge { color: #f39c12; font-weight: bold; animation: blink 1.5s infinite; }

        /* Product Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; transition: 0.3s; border: 1px solid #ddd; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .card-body { padding: 12px; text-align: center; }
        .card-body b { display: block; font-size: 15px; margin-bottom: 5px; }
        .price { color: var(--accent); font-weight: 700; font-size: 14px; }
        .stok { font-size: 11px; background: #eee; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 5px; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; position: relative; max-height: 90vh; overflow-y: auto; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        .btn-pay { background: var(--success); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }

        /* Admin Link */
        .admin-float { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-size: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 99; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="header">
    <h1>SANNSHOP</h1>
    <p>⚡ DonutSmp Shop Aman Terpercaya ⚡</p>
</div>

<div class="container">
    <div class="antrean-card">
        <div class="antrean-header">⏳ Antrean Pembeli Saat Ini</div>
        <div id="antrean-list">Memuat antrean...</div>
    </div>

    <div id="product-grid" class="grid"></div>
</div>

<a href="admin-produk.html" class="admin-float">⚙️ Panel Admin</a>

<div id="orderModal" class="modal">
    <div class="modal-content">
        <h2 id="m-title" style="margin-top:0">Order</h2>
        <p id="m-price-info" style="color:var(--accent); font-weight:bold;"></p>
        
        <input type="text" id="m-ign" placeholder="Masukkan IGN / Nickname">
        <input type="number" id="m-qty" value="1" min="1" oninput="updateTotal()">
        
        <label>Metode Pembayaran:</label>
        <select id="m-method" onchange="showPaymentDetails()">
            <option value="DANA">DANA (08989294545)</option>
            <option value="GOPAY">GOPAY (08989294545)</option>
            <option value="QRIS">QRIS All Payment</option>
        </select>

        <div id="qris-area" style="display:none; text-align:center; margin: 15px 0;">
            <img src="https://i.ibb.co.com/5hnkQRy6/1773671419683.jpg" style="width:200px; border: 2px solid #ddd; border-radius:10px;">
            <p style="font-size:11px; color:#666;">Scan QRIS di atas untuk membayar</p>
        </div>

        <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin:15px 0;">
            <small>Total Bayar:</small>
            <div id="m-total" style="font-size:20px; font-weight:bold; color:var(--success);">Rp 0</div>
        </div>

        <label>Upload Bukti Transfer:</label>
        <input type="file" id="m-bukti" accept="image/*">

        <button class="btn-pay" id="btn-submit" onclick="submitOrder()">KIRIM PESANAN</button>
        <button onclick="closeModal()" style="width:100%; border:none; background:none; color:red; cursor:pointer; margin-top:10px;">Batal</button>
    </div>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    // GANTI URL DI BAWAH INI DENGAN URL GAS EXEC TERBARU KAMU!
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw1J9_f6lmg5rlohQgj11_zwA5Xa68Ed-K3k-rUbvoRhIfwqFqlBLS5k0nfHq8sHpPbrg/exec";
    let products = [];
    let activeItem = null;

    async function fetchData() {
        const res = await fetch(`${S_URL}/rest/v1/produk?order=id.asc`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        products = await res.json();
        renderProducts();
        fetchAntrean();
    }

    function renderProducts() {
        document.getElementById("product-grid").innerHTML = products.map(p => `
            <div class="card" onclick="openOrder(${p.id})">
                <img src="${p.img_url}" onerror="this.src='https://via.placeholder.com/150'">
                <div class="card-body">
                    <b>${p.nama_produk}</b>
                    <div class="price">Rp ${p.harga.toLocaleString()}</div>
                    <div class="stok">Stok: ${p.stok}</div>
                </div>
            </div>
        `).join("");
    }

    // FITUR SENSOR IGN
    function sensorIGN(name) {
        if (name.length <= 2) return name + "***";
        return name.substring(0, 1) + "***" + name.substring(name.length - 1);
    }

    async function fetchAntrean() {
        const res = await fetch(`${S_URL}/rest/v1/penjualan?status=eq.PENDING&order=created_at.desc&limit=5`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        const list = document.getElementById("antrean-list");
        if(data.length === 0) {
            list.innerHTML = "<div style='color:#999'>Belum ada antrean saat ini.</div>";
            return;
        }
        list.innerHTML = data.map(a => `
            <div class="antrean-item">
                <span>👤 <b>${sensorIGN(a.ign)}</b> beli ${a.nama_item} (${a.jumlah})</span>
                <span class="status-badge">Sedang Diproses</span>
            </div>
        `).join("");
    }

    function openOrder(id) {
        activeItem = products.find(p => p.id === id);
        if(activeItem.stok <= 0) return alert("Stok habis bosku!");
        document.getElementById("m-title").innerText = activeItem.nama_produk;
        document.getElementById("m-price-info").innerText = "@ Rp " + activeItem.harga.toLocaleString();
        document.getElementById("orderModal").style.display = "flex";
        updateTotal();
    }

    function closeModal() { document.getElementById("orderModal").style.display = "none"; }
    function showPaymentDetails() { document.getElementById("qris-area").style.display = document.getElementById("m-method").value === "QRIS" ? "block" : "none"; }
    function updateTotal() { document.getElementById("m-total").innerText = "Rp " + (document.getElementById("m-qty").value * activeItem.harga).toLocaleString(); }

    async function submitOrder() {
        const ign = document.getElementById("m-ign").value;
        const qty = parseInt(document.getElementById("m-qty").value);
        const file = document.getElementById("m-bukti").files[0];

        if(!ign || !file) return alert("Lengkapi IGN dan Bukti Transfer!");

        const btn = document.getElementById("btn-submit");
        btn.innerText = "Mengirim..."; btn.disabled = true;

        try {
            // 1. Potong Stok
            await fetch(`${S_URL}/rest/v1/produk?id=eq.${activeItem.id}`, {
                method: "PATCH",
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ stok: activeItem.stok - qty })
            });

            // 2. Simpan Data Jual
            const resJual = await fetch(`${S_URL}/rest/v1/penjualan`, {
                method: "POST",
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
                body: JSON.stringify({ ign, nama_item: activeItem.nama_produk, jumlah: qty, total_bayar: qty * activeItem.harga, status: "PENDING" })
            });
            const dataJual = await resJual.json();

            // 3. Kirim Telegram
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(",")[1];
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "upload_bukti",
                        image: base64,
                        id_jual: dataJual[0].id,
                        id_produk: activeItem.id,
                        jumlah_beli: qty,
                        caption: `🔔 *PESANAN BARU SANN SHOP*\n\n👤 IGN: ${ign}\n📦 Item: ${activeItem.nama_produk}\n🔢 Qty: ${qty}\n💰 Total: Rp ${(qty * activeItem.harga).toLocaleString()}`
                    })
                });
                alert("Berhasil! Silakan tunggu konfirmasi admin.");
                location.reload();
            };
            reader.readAsDataURL(file);
        } catch (err) {
            alert("Gagal: " + err.message);
            btn.disabled = false;
        }
    }

    fetchData();
    setInterval(fetchAntrean, 15000);
</script>
</body>
</html>
