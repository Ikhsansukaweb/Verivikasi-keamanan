<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SannShop - Money Donut Aman Terpercaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: url('https://i.ibb.co/bRpxTR8/1773672279828-minecraft-background.png') no-repeat center center fixed;
            background-size: cover;
            color: #333;
        }

        /* LAYAR LOGIN */
        #loginPage {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #121212cc;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--success);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #1e8449;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 0 0 20px 20px;
            color: #333;
            user-select: none;
        }
        .header h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 700;
        }
        .header p {
            font-size: 14px;
            margin: 5px 0 0;
            font-weight: 500;
            color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 20px auto 60px;
            padding: 0 15px;
        }

        /* Antrean Section */
        .antrean-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 6px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 14px;
        }
        .antrean-header {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 10px;
            user-select: none;
        }
        #antrean-list {
            color: #666;
            user-select: text;
        }
        .antrean-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }
        .status-badge {
            color: #f39c12;
            font-weight: bold;
            animation: blink 1.5s infinite;
            user-select: none;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            user-select: none;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card img {
            border-radius: 20px 20px 0 0;
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: white;
        }
        .card-body {
            padding: 15px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-body b {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #222;
        }
        .price {
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
            margin-top: auto;
        }
        .stok {
            font-size: 12px;
            background: #e0e0e0;
            color: #666;
            padding: 4px 10px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 8px;
            user-select: text;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            user-select: none;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }
        .btn-pay {
            background: var(--success);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            user-select: none;
        }

        /* FLOAT GROUP KANAN BAWAH */
        .float-group {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            align-items: flex-end;
            user-select: none;
        }

        .btn-wa-logo {
            background: #25d366;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.25);
            transition: background 0.3s;
            cursor: pointer;
        }
        .btn-wa-logo:hover {
            background: #1ebe57;
        }
        .btn-wa-logo img {
            width: 28px !important;
            height: 28px !important;
            display: block;
        }

        .admin-link {
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 11px;
            opacity: 0.85;
            user-select: none;
            transition: opacity 0.3s;
        }
        .admin-link:hover {
            opacity: 1;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Responsive tweaks */
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .card img {
                height: 200px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header p {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-box">
        <h2 style="color:var(--accent); margin-top:0;">SANNSHOP</h2>
        <input type="text" id="userLogin" placeholder="Username" />
        <input type="password" id="passLogin" placeholder="Password" />
        <button onclick="cekLogin()" class="btn-login">MASUK / DAFTAR</button>
    </div>
</div>

<div class="header">
    <h1>SANNSHOP</h1>
    <p>⚡ DonutSmp Shop Aman Terpercaya ⚡</p>
</div>

<div class="container">
    <div class="antrean-card">
        <div class="antrean-header">⏳ Antrean Pembeli Saat Ini</div>
        <div id="antrean-list">Memuat antrean...</div>
    </div>
    <div id="product-grid" class="grid"></div>
</div>

<div class="float-group">
    <a href="admin-produk.html" class="admin-link">⚙️ Panel Admin</a>
    <a href="https://wa.me/628989294545?text=Halo%20Admin%20SannShop" target="_blank" class="btn-wa-logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WA" />
    </a>
</div>

<div id="orderModal" class="modal" onclick="if(event.target==this) closeModal()">
    <div class="modal-content">
        <h2 id="m-title" style="margin-top:0">Order</h2>
        <p id="m-price-info" style="color:var(--accent); font-weight:bold;"></p>
        <input type="text" id="m-ign" placeholder="Masukkan IGN / Nickname" />
        <input type="number" id="m-qty" value="1" min="1" oninput="updateTotal()" />
        <label>Metode Pembayaran:</label>
        <select id="m-method" onchange="showPaymentDetails()">
            <option value="DANA">DANA (08989294545)</option>
            <option value="GOPAY">GOPAY (08989294545)</option>
            <option value="QRIS">QRIS All Payment</option>
        </select>
        <div id="qris-area" style="display:none; text-align:center; margin: 15px 0;">
            <img src="https://i.ibb.co/5hnkQRy6/1773671419683.jpg" style="width:200px; border: 2px solid #ddd; border-radius:10px;" alt="QRIS" />
            <p style="font-size:11px; color:#666;">Scan QRIS di atas untuk membayar</p>
        </div>
        <div style="background:#f9f9f9; padding:15px; border-radius:10px; margin:15px 0;">
            <small>Total Bayar:</small>
            <div id="m-total" style="font-size:20px; font-weight:bold; color:var(--success);">Rp 0</div>
        </div>
        <label>Upload Bukti Transfer:</label>
        <input type="file" id="m-bukti" accept="image/*" />
        <button class="btn-pay" id="btn-submit" onclick="submitOrder()">KIRIM PESANAN</button>
        <button onclick="closeModal()" style="width:100%; border:none; background:none; color:red; cursor:pointer; margin-top:10px;">Batal</button>
    </div>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyeXwWMMNpi1B7DThs13lk3JZlqWIV8NjdMwfvcEjMK9ywbzAxe258BE75RR74kw-pT1A/exec";
    
    let products = [];
    let activeItem = null;
    let userAktif = localStorage.getItem("sann_user");

    if(userAktif) document.getElementById('loginPage').style.display = 'none';

    async function cekLogin() {
        const u = document.getElementById('userLogin').value;
        const p = document.getElementById('passLogin').value;
        if(!u || !p) return alert("Isi data!");
        if(u === "admin" && p === "admin123") {
            localStorage.setItem("sann_user", "admin");
            location.reload(); return;
        }
        const res = await fetch(`${S_URL}/rest/v1/users_web?username=eq.${u}`, { headers: {"apikey": S_KEY} });
        const data = await res.json();
        if(data.length === 0) {
            await fetch(`${S_URL}/rest/v1/users_web`, {
                method:'POST', headers:{"apikey":S_KEY,"Content-Type":"application/json"},
                body: JSON.stringify({username:u, password:p})
            });
        } else if(data[0].password !== p) { return alert("Password salah!"); }
        localStorage.setItem("sann_user", u);
        location.reload();
    }

    async function fetchData() {
        const res = await fetch(`${S_URL}/rest/v1/produk?order=id.asc`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        products = await res.json();
        renderProducts();
        fetchAntrean();
    }

    function renderProducts() {
        document.getElementById("product-grid").innerHTML = products.map(p => `
            <div class="card" onclick="openOrder(${p.id})" title="${p.nama_produk}">
                <img src="${p.img_url}" alt="${p.nama_produk}" onerror="this.src='https://via.placeholder.com/150'">
                <div class="card-body">
                    <b>${p.nama_produk}</b>
                    <div class="price">Rp ${p.harga.toLocaleString()}</div>
                    <div class="stok">Stok: ${p.stok}</div>
                </div>
            </div>
        `).join("");
    }

    function sensorIGN(name) {
        if (name.length <= 2) return name + "***";
        return name.substring(0, 1) + "***" + name.substring(name.length - 1);
    }

    async function fetchAntrean() {
        const res = await fetch(`${S_URL}/rest/v1/penjualan?status=eq.PENDING&order=created_at.desc&limit=5`, { headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` } });
        const data = await res.json();
        const list = document.getElementById("antrean-list");
        if(data.length === 0) {
            list.innerHTML = "<div style='color:#999'>Belum ada antrean saat ini.</div>";
            return;
        }
        list.innerHTML = data.map(a => `
            <div class="antrean-item" title="Sedang diproses">
                <span>👤 <b>${sensorIGN(a.ign)}</b> beli ${a.nama_item} (${a.jumlah})</span>
                <span class="status-badge">Sedang Diproses</span>
            </div>
        `).join("");
    }

    function openOrder(id) {
        activeItem = products.find(p => p.id === id);
        if(!activeItem) return alert("Produk tidak ditemukan!");
        if(activeItem.stok <= 0) return alert("Stok habis bosku!");
        document.getElementById("m-title").innerText = activeItem.nama_produk;
        document.getElementById("m-price-info").innerText = "@ Rp " + activeItem.harga.toLocaleString();
        document.getElementById("orderModal").style.display = "flex";
        document.getElementById("m-ign").value = "";
        document.getElementById("m-qty").value = 1;
        document.getElementById("m-bukti").value = "";
        showPaymentDetails();
        updateTotal();
    }

    function closeModal() {
        document.getElementById("orderModal").style.display = "none";
    }
    function showPaymentDetails() {
        const qrisArea = document.getElementById("qris-area");
        qrisArea.style.display = document.getElementById("m-method").value === "QRIS" ? "block" : "none";
    }
    function updateTotal() {
        const qty = parseInt(document.getElementById("m-qty").value);
        let total = 0;
        if(activeItem && !isNaN(qty) && qty > 0) {
            total = qty * activeItem.harga;
        }
        document.getElementById("m-total").innerText = "Rp " + total.toLocaleString();
    }

    async function submitOrder() {
        const ign = document.getElementById("m-ign").value.trim();
        const qty = parseInt(document.getElementById("m-qty").value);
        const file = document.getElementById("m-bukti").files[0];

        if(!ign || !file) return alert("Lengkapi IGN dan Bukti Transfer!");

        const btn = document.getElementById("btn-submit");
        btn.innerText = "Mengirim..."; btn.disabled = true;

        try {
            // 1. Potong Stok
            await fetch(`${S_URL}/rest/v1/produk?id=eq.${activeItem.id}`, {
                method: "PATCH",
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ stok: activeItem.stok - qty })
            });

            // 2. Simpan Data Jual
            const resJual = await fetch(`${S_URL}/rest/v1/penjualan`, {
                method: "POST",
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" },
                body: JSON.stringify({ ign, nama_item: activeItem.nama_produk, jumlah: qty, total_bayar: qty * activeItem.harga, status: "PENDING" })
            });
            const dataJual = await resJual.json();

            // 3. Kirim Telegram via GAS
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(",")[1];
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "upload_bukti",
                        image: base64,
                        id_jual: dataJual[0].id,
                        id_produk: activeItem.id,
                        jumlah_beli: qty,
                        caption: `🔔 *PESANAN BARU SANN SHOP*\n\n👤 IGN: ${ign}\n📦 Item: ${activeItem.nama_produk}\n🔢 Qty: ${qty}\n💰 Total: Rp ${(qty * activeItem.harga).toLocaleString()}`
                    })
                });
                alert("Berhasil! Silakan tunggu konfirmasi admin.");
                location.reload();
            };
            reader.readAsDataURL(file);
        } catch (err) {
            alert("Gagal: " + err.message);
            btn.disabled = false;
            btn.innerText = "KIRIM PESANAN";
        }
    }

    fetchData();
    setInterval(fetchAntrean, 15000);
</script>

</body>
      </html>
