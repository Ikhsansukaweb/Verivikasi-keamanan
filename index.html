<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZKALL SHOP - Jual Money</title>
    <style>
        :root { --primary: #0088cc; --secondary: #2ecc71; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .store-container { max-width: 450px; margin: auto; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 20px; }
        .product-card { border: 2px solid #eef2f7; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; background: #fff; }
        .stock-badge { display: inline-block; background: #ff4757; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-top: 8px; transition: 0.5s; }
        
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        
        .payment-box { background: #fff9e6; border-left: 5px solid #f1c40f; padding: 12px; margin-top: 15px; border-radius: 4px; }
        .total-price { font-size: 1.2em; font-weight: bold; color: #e67e22; }

        .btn-beli { background: var(--secondary); color: white; border: none; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-beli:disabled { background: #ccc; cursor: not-allowed; }
        .footer { text-align: center; padding: 15px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="store-container">
    <div class="header">
        <h1>DZKALL SHOP</h1>
        <p>Top Up Aman, Kilat & Terpercaya</p>
    </div>

    <div class="content">
        <div class="product-card">
            <span style="font-weight:bold; font-size: 1.3em; color: #333;">1M MONEY</span><br>
            <div class="stock-badge" id="badge-stok">STOK: <span id="stok-angka">Mengecek...</span></div>
        </div>

        <label>Beli Berapa (M)?</label>
        <input type="number" id="jumlah" value="1" min="1" oninput="updateTotal()">

        <label>In Game Name (IGN)</label>
        <input type="text" id="ign" placeholder="Masukkan Nickname Game">

        <label>Catatan Pesanan</label>
        <textarea id="catatan" rows="2" placeholder="Contoh: Trade di depan bank"></textarea>

        <label>Metode Pembayaran</label>
        <select id="metode">
            <option value="DANA">DANA (08989294545)</option>
            <option value="GOPAY">GOPAY (08989294545)</option>
            <option value="QRIS">QRIS (Scan Gambar)</option>
        </select>

        <label>Upload Bukti Transfer</label>
        <input type="file" id="bukti" accept="image/*">
        
        <div class="payment-box">
            Total Bayar: <span class="total-price" id="total">Rp 600</span>
        </div>

        <button class="btn-beli" id="submit-btn" onclick="kirimPesanan()">KONFIRMASI PEMBAYARAN</button>
    </div>
    <div class="footer">© 2026 DZKALL SHOP</div>
</div>

<script>
    // URL Deployment baru kamu
    const webAppUrl = "https://script.google.com/macros/s/AKfycby6SvN9VmuODPoltuPGaMlZQD6pjvLFb9x59CwWvZoaGZfmFizpNbnLpEB3QL4EuDnZvw/exec";
    const hargaM = 600;
    let stokSekarang = 0;

    // Ambil Stok lewat Google Script (Proxy)
    async function loadStok() {
        try {
            const res = await fetch(webAppUrl);
            const data = await res.json();
            stokSekarang = parseInt(data.stok) || 0;
            
            const badge = document.getElementById("badge-stok");
            document.getElementById("stok-angka").innerText = stokSekarang;
            badge.style.background = "#2ecc71"; // Hijau kalau berhasil
        } catch (e) { 
            document.getElementById("stok-angka").innerText = "Gagal Muat";
            console.error("Gagal ambil stok:", e);
        }
    }

    function updateTotal() {
        const j = document.getElementById("jumlah").value;
        document.getElementById("total").innerText = "Rp " + (j * hargaM).toLocaleString();
    }

    function kirimPesanan() {
        const btn = document.getElementById("submit-btn");
        const ign = document.getElementById("ign").value;
        const file = document.getElementById("bukti").files[0];
        const jml = document.getElementById("jumlah").value;

        if (!ign || !file) return alert("Lengkapi IGN dan Upload Foto Bukti!");
        if (parseInt(jml) > stokSekarang && stokSekarang !== 0) return alert("Stok tidak mencukupi!");

        btn.innerText = "Sedang Mengirim...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result.split(",")[1];
            const caption = `🚀 PESANAN BARU - DZKALL SHOP\n` +
                          `--------------------------\n` +
                          `👤 IGN: ${ign}\n` +
                          `🔢 Jumlah: ${jml} M\n` +
                          `💳 Via: ${document.getElementById("metode").value}\n` +
                          `📝 Catatan: ${document.getElementById("catatan").value}\n` +
                          `--------------------------`;

            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({
                    action: "upload_bukti",
                    image: base64,
                    type: file.type,
                    caption: caption
                })
            }).then(() => {
                alert("Berhasil! Pesanan & Bukti Transfer telah dikirim ke Telegram Ikhsan.");
                location.reload();
            }).catch((err) => {
                // Biasanya no-cors masuk sini tapi tetep terkirim
                alert("Pesanan terkirim! Silakan cek Telegram.");
                location.reload();
            });
        };
        reader.readAsDataURL(file);
    }

    // Jalankan ambil stok saat web dibuka
    loadStok();
</script>
</body>
</html>
