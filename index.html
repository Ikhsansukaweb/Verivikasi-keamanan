<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZKALL SHOP - Official Store</title>
    <style>
        :root { --primary: #855e42; --secondary: #2ecc71; }
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            background-image: url('https://i.ibb.co.com/SX9rTn7L/1773672279828.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .store-container { 
            max-width: 450px; margin: 5vh auto; 
            background: rgba(255, 255, 255, 0.85); 
            border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); overflow: hidden; 
            backdrop-filter: blur(5px);
        }
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; }
        .content { padding: 20px; }
        .product-card { border: 2px solid rgba(133,94,66,0.2); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; background: rgba(255,255,255,0.5); }
        .stock-badge { display: inline-block; background: var(--secondary); color: white; padding: 6px 18px; border-radius: 20px; font-weight: bold; margin-top: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9em; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .qris-section { text-align: center; margin-top: 15px; display: none; padding: 10px; background: white; border-radius: 8px; }
        .qris-section img { width: 200px; height: auto; border: 1px solid #eee; }
        .payment-box { background: #fff9e6; border-left: 5px solid #f1c40f; padding: 15px; margin-top: 20px; border-radius: 8px; }
        .btn-beli { background: var(--secondary); color: white; border: none; width: 100%; padding: 18px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-beli:disabled { background: #ccc; cursor: not-allowed; }
        .footer { text-align: center; padding: 20px; font-size: 11px; color: #666; }
        .admin-nav { margin-top: 10px; display: flex; justify-content: center; gap: 10px; }
        .admin-link { color: var(--primary); text-decoration: none; opacity: 0.6; font-weight: bold; padding: 5px; border: 1px solid #855e42; border-radius: 5px; font-size: 10px; }
    </style>
</head>
<body>

<div class="store-container">
    <div class="header">
        <h1>DZKALL SHOP</h1>
        <p>Top Up Aman & Real-time</p>
    </div>
    <div class="content">
        <div class="product-card">
            <span style="font-weight:bold; font-size: 1.4em;">1M MONEY</span><br>
            <div class="stock-badge">STOK: <span id="stok-angka">Memuat...</span></div>
        </div>
        
        <label>Beli Berapa (M)?</label>
        <input type="number" id="jumlah" value="1" min="1" oninput="updateTotal()">
        
        <label>In Game Name (IGN)</label>
        <input type="text" id="ign" placeholder="Nickname Game">
        
        <label>Metode Pembayaran</label>
        <select id="metode" onchange="toggleQris()">
            <option value="DANA">DANA (08989294545)</option>
            <option value="GOPAY">GOPAY (08989294545)</option>
            <option value="QRIS">QRIS (Scan Gambar)</option>
        </select>

        <div id="qris-area" class="qris-section">
            <p style="font-size: 10px; color: red; font-weight: bold;">SCAN QRIS DI BAWAH INI</p>
            <img src="https://i.ibb.co.com/5hnkQRy6/1773671419683.jpg" alt="QRIS">
        </div>

        <label>Upload Bukti Transfer</label>
        <input type="file" id="bukti" accept="image/*">
        
        <div class="payment-box">Total Bayar: <strong style="color: #e67e22; font-size: 1.3em;" id="total">Rp 600</strong></div>
        
        <button class="btn-beli" id="submit-btn" onclick="kirimPesanan()">KONFIRMASI PEMBAYARAN</button>
    </div>

    <div class="footer">
        © 2026 DZKALL SHOP<br>
        <div class="admin-nav">
            <a href="login.html" class="admin-link">🔑 Staff Login</a>
            <a href="rekap.html" class="admin-link">📊 Lihat Rekap</a>
        </div>
    </div>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    // UPDATE EXEC TERBARU KAMU
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwrR9XcCWZBxc-mkqv6rdeyhSKSPqzIWzS1cjXxK1nJImQy4U4oihZcuCcf3PKnm3mOfA/exec";
    const hargaM = 600;
    let stokDb = 0;

    async function fetchStok() {
        try {
            const res = await fetch(`${S_URL}/rest/v1/produk?nama_produk=eq.1M%20MONEY&select=stok`, {
                headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
            });
            const data = await res.json();
            if (data.length > 0) {
                stokDb = data[0].stok;
                document.getElementById("stok-angka").innerText = stokDb + " M";
            }
        } catch(e) { console.error("Gagal ambil stok"); }
    }

    function updateTotal() {
        const jml = document.getElementById("jumlah").value;
        document.getElementById("total").innerText = "Rp " + (jml * hargaM).toLocaleString();
    }

    function toggleQris() {
        const m = document.getElementById("metode").value;
        document.getElementById("qris-area").style.display = (m === "QRIS") ? "block" : "none";
    }

    async function kirimPesanan() {
        const btn = document.getElementById("submit-btn");
        const ign = document.getElementById("ign").value;
        const jml = parseInt(document.getElementById("jumlah").value);
        const file = document.getElementById("bukti").files[0];
        const metodenya = document.getElementById("metode").value;

        if (!ign || !file) return alert("Lengkapi IGN dan Bukti Transfer!");
        if (jml > stokDb) return alert("Maaf, stok tidak mencukupi!");

        btn.disabled = true; btn.innerText = "Memproses...";

        try {
            // STEP 1: Masuk ke Penjualan status PENDING (Tidak potong stok produk)
            const resJual = await fetch(`${S_URL}/rest/v1/penjualan`, {
                method: "POST",
                headers: { 
                    "apikey": S_KEY, 
                    "Authorization": `Bearer ${S_KEY}`, 
                    "Content-Type": "application/json", 
                    "Prefer": "return=representation" 
                },
                body: JSON.stringify({ ign: ign, jumlah: jml, total_bayar: jml * hargaM, status: "PENDING" })
            });
            
            const dataJual = await resJual.json();
            const idPesanan = dataJual[0].id;

            // STEP 2: Kirim data ke Telegram
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(",")[1];
                await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "upload_bukti",
                        image: base64,
                        type: file.type,
                        id_jual: idPesanan,
                        jumlah_beli: jml,
                        caption: `🚀 PESANAN BARU\nIGN: ${ign}\nJumlah: ${jml}M\nMetode: ${metodenya}\nTotal: Rp ${(jml*hargaM).toLocaleString()}`
                    })
                });
                alert("Pesanan terkirim! Silakan tunggu konfirmasi admin.");
                location.reload();
            };
            reader.readAsDataURL(file);
        } catch (err) {
            alert("Error: " + err.message);
            btn.disabled = false;
        }
    }
    fetchStok();
</script>
</body>
</html>
