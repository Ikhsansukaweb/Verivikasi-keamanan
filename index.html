<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKHSAN STORE</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f9; padding: 15px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1877f2; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .item-card { border: 2px solid #eee; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; }
        .item-card.active { border-color: #1877f2; background: #e7f3ff; }
        .harga { color: #1877f2; font-weight: bold; display: block; }
        .stok { font-size: 12px; color: #666; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 IKHSAN STORE</h2>
    
    <label><b>Pilih Item:</b></label>
    <div id="loading">Memuat stok...</div>
    <div class="item-grid" id="menu-item"></div>
    <input type="hidden" id="selected_item">

    <input type="text" id="game_id" placeholder="ID Game">
    <input type="text" id="nickname" placeholder="Nickname">
    
    <select id="metode">
        <option value="">-- Pilih Pembayaran --</option>
        <option value="DANA">DANA</option>
        <option value="QRIS">QRIS</option>
    </select>

    <label><b>Upload Bukti Transfer:</b></label>
    <input type="file" id="bukti" accept="image/*">

    <button class="btn" onclick="kirim()">Konfirmasi Pembayaran</button>
</div>

<script>
    // Link CSV kamu
    const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQhFwi5JuW2MdHgK8X5QZgjXQr4TaG6rzuLUwHRWK-6wzGbrzSwg0wFMhJknCaM6EJW8cqI9-e7H0A8/pub?gid=0&single=true&output=csv';

    async function loadStok() {
        try {
            const res = await fetch(CSV);
            const data = await res.text();
            const rows = data.split('\n').filter(r => r.trim() !== '');
            let html = '';

            rows.forEach(row => {
                const col = row.split(',');
                // Membaca Kolom E (index 4), F (index 5), dan G (index 6)
                if (col.length >= 7) { 
                    const nama = col[4].trim();
                    const harga = col[5].trim();
                    const stok = col[6].trim();
                    
                    if(nama !== "") {
                        html += `
                        <div class="item-card" onclick="pilih(this, '${nama}', '${harga}')">
                            <b>${nama}</b>
                            <span class="harga">${harga}</span>
                            <span class="stok">Stok: ${stok}</span>
                        </div>`;
                    }
                }
            });
            document.getElementById('menu-item').innerHTML = html;
            document.getElementById('loading').style.display = 'none';
        } catch (e) {
            document.getElementById('loading').innerText = 'Gagal memuat data.';
        }
    }

    function pilih(el, nama, harga) {
        document.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('selected_item').value = nama + " (" + harga + ")";
    }

    async function kirim() {
        const item = document.getElementById('selected_item').value;
        const id = document.getElementById('game_id').value;
        const file = document.getElementById('bukti').files[0];

        if(!item || !id || !file) return alert("Lengkapi data dan upload bukti!");

        const token = '8733750993:AAGe696DEkdJzlDJK1o6MLnhLWh2PWIBYqg';
        const chatId = '8460192289';
        const teks = `🛒 PESANAN BARU\nItem: ${item}\nID: ${id}\nMetode: ${document.getElementById('metode').value}`;

        const fd = new FormData();
        fd.append("chat_id", chatId);
        fd.append("photo", file);
        fd.append("caption", teks);

        await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, { method: "POST", body: fd });
        alert("Pesanan dikirim!");
        location.reload();
    }

    loadStok();
</script>
</body>
</html>
