<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZKALL SHOP - Supabase Edition</title>
    <style>
        :root { --primary: #855e42; --secondary: #2ecc71; }
        body { 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; 
            background-image: url('https://i.ibb.co.com/SX9rTn7L/1773672279828.png'); 
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        .store-container { 
            max-width: 450px; margin: 5vh auto; 
            background: rgba(255, 255, 255, 0.85); 
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; 
        }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .product-card { border: 2px solid #eef2f7; border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 20px; background: rgba(255, 255, 255, 0.5); }
        .stock-badge { display: inline-block; background: var(--secondary); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-top: 8px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: rgba(255, 255, 255, 0.7); }
        .qris-section { text-align: center; margin-top: 15px; display: none; padding: 10px; border: 1px solid #eee; border-radius: 8px; background: #fff; }
        .qris-section img { width: 250px; height: auto; image-rendering: -webkit-optimize-contrast; }
        .payment-box { background: #fff9e6; border-left: 5px solid #f1c40f; padding: 12px; margin-top: 15px; border-radius: 4px; }
        .btn-beli { background: var(--secondary); color: white; border: none; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        .btn-beli:disabled { background: #ccc; }
        .footer { text-align: center; padding: 15px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="store-container">
    <div class="header">
        <h1>DZKALL SHOP</h1>
        <p>Database by Supabase ⚡</p>
    </div>
    <div class="content">
        <div class="product-card">
            <span style="font-weight:bold; font-size: 1.3em;">1M MONEY</span><br>
            <div class="stock-badge">STOK: <span id="stok-angka">Memuat...</span></div>
        </div>
        <label>Beli Berapa (M)?</label>
        <input type="number" id="jumlah" value="1" min="1" oninput="updateTotal()">
        <label>In Game Name (IGN)</label>
        <input type="text" id="ign" placeholder="Nickname Game">
        <label>Metode Pembayaran</label>
        <select id="metode" onchange="toggleQris()">
            <option value="DANA">DANA (08989294545)</option>
            <option value="QRIS">QRIS (Scan Gambar)</option>
        </select>
        <div id="qris-area" class="qris-section">
            <img id="gambar-qris" src="https://i.ibb.co.com/ZRDgCpXZ/qris.png" alt="QRIS">
        </div>
        <label>Upload Bukti Transfer</label>
        <input type="file" id="bukti" accept="image/*">
        <div class="payment-box">Total: <strong id="total">Rp 600</strong></div>
        <button class="btn-beli" id="submit-btn" onclick="kirimPesanan()">KONFIRMASI PEMBAYARAN</button>
    </div>
    <div class="footer">© 2026 DZKALL SHOP</div>
</div>

<script>
    const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co";
    const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw2ztI1pJJV2yYthStKYjI3VmEQAfRNUAWqHsmDV1E87XeOz7BAllNoV1UcrCZ7jWWN/exec";

    let stokDb = 0;

    async function fetchStok() {
        const res = await fetch(`${S_URL}/rest/v1/produk?nama_produk=eq.1M%20MONEY&select=stok`, {
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}` }
        });
        const data = await res.json();
        stokDb = data[0].stok;
        document.getElementById("stok-angka").innerText = stokDb;
    }

    function updateTotal() {
        document.getElementById("total").innerText = "Rp " + (document.getElementById("jumlah").value * 600).toLocaleString();
    }

    function toggleQris() {
        document.getElementById("qris-area").style.display = (document.getElementById("metode").value === "QRIS") ? "block" : "none";
    }

    async function kirimPesanan() {
        const btn = document.getElementById("submit-btn");
        const ign = document.getElementById("ign").value;
        const jml = parseInt(document.getElementById("jumlah").value);
        const file = document.getElementById("bukti").files[0];

        if (!ign || !file) return alert("Isi IGN dan Bukti!");
        if (jml > stokDb) return alert("Stok tidak cukup!");

        btn.disabled = true; btn.innerText = "Memproses...";

        // 1. Update Stok di Supabase
        const updateRes = await fetch(`${S_URL}/rest/v1/produk?nama_produk=eq.1M%20MONEY`, {
            method: "PATCH",
            headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
            body: JSON.stringify({ stok: stokDb - jml })
        });

        // 2. Kirim Notif ke Telegram via GAS
        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result.split(",")[1];
            await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "upload_bukti",
                    image: base64,
                    type: file.type,
                    ign: ign,
                    jumlah_beli: jml,
                    caption: `🚀 PESANAN BARU (SUPABASE)\n👤 IGN: ${ign}\n🔢 Jumlah: ${jml} M\n💰 Total: Rp ${(jml*600).toLocaleString()}`
                })
            });
            alert("Pesanan Berhasil! Stok Terpotong Otomatis.");
            location.reload();
        };
        reader.readAsDataURL(file);
    }
    fetchStok();
</script>
</body>
    </html>
