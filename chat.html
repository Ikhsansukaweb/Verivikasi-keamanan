<!DOCTYPE html>
<html>
<head>
    <title>Chat with Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px 14px; border-radius: 12px; max-width: 80%; font-size: 14px; }
        .me { background: #2ecc71; align-self: flex-end; border-bottom-right-radius: 2px; }
        .admin { background: #333; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #ff9800; }
        .input-area { padding: 15px; background: #1e1e1e; display: flex; gap: 8px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
        button { background: #ff9800; border: none; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div style="padding: 15px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
        <b>💬 Chat Admin</b>
        <a href="index.html" style="color:#ff9800; text-decoration:none; font-size:12px;">Kembali ke Toko</a>
    </div>
    <div id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="msgInp" placeholder="Tulis pesan ke admin...">
        <button onclick="kirim()">Kirim</button>
    </div>

    <script>
        const S_URL = "https://ybllqewkapqmtxknmqmd.supabase.co/rest/v1";
        const S_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlibGxxZXdrYXBxbXR4a25tcW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NjgzMDYsImV4cCI6MjA4OTI0NDMwNn0.S3FOYT7lkSMqnOiuWuYwNu6Alf0YCK5Ki0aX_1EX1H0";
        const userAktif = localStorage.getItem("sann_user");

        if(!userAktif) window.location.href = "login.html";

        async function muatChat() {
            const res = await fetch(`${S_URL}/pesan_chat?or=(pengirim.eq.${userAktif},penerima.eq.${userAktif})&order=created_at.asc`, { headers: { "apikey": S_KEY } });
            const data = await res.json();
            let html = "";
            data.forEach(m => {
                const tipe = m.pengirim === userAktif ? "me" : "admin";
                html += `<div class="bubble ${tipe}">${m.isi_pesan}</div>`;
            });
            document.getElementById('chatBox').innerHTML = html;
            const cb = document.getElementById('chatBox');
            cb.scrollTop = cb.scrollHeight;
        }

        async function kirim() {
            const msg = document.getElementById('msgInp').value;
            if(!msg) return;
            await fetch(`${S_URL}/pesan_chat`, {
                method: 'POST', headers: { "apikey": S_KEY, "Authorization": `Bearer ${S_KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({ pengirim: userAktif, penerima: 'admin', isi_pesan: msg })
            });
            document.getElementById('msgInp').value = "";
            muatChat();
        }

        setInterval(muatChat, 3000);
        muatChat();
    </script>
</body>
</html>
